  -DI2C_FREQ=100000

  -DONEWIRE_PIN=7

  -DIR_TX_PIN=2 -DIR_RX_PIN=1

  -DLED_DATA_PIN=48 -DLED_CLOCK_PIN=47

  -DI2S_BCLK_PIN=47 -DI2S_LRCK_PIN=48 -DI2S_DATA_PIN=7
  -DI2S_SAMPLE_RATE=16000
  -DI2S_BITS=16

  -DCAN_CS_PIN=6 -DCAN_SCK_PIN=5 -DCAN_SI_PIN=4 -DCAN_SO_PIN=7
  -DCAN_KBPS=125

  -DETHERNET_CS_PIN=6 -DETHERNET_CLK_PIN=5 -DETHERNET_MISO_PIN=7 -DETHERNET_MOSI_PIN=4 -DETHERNET_IRQ_PIN=2

  -DSUBGHZ_CS_PIN=6 -DSUBGHZ_SCK_PIN=5 -DSUBGHZ_SI_PIN=4 -DSUBGHZ_SO_PIN=7 -DSUBGHZ_GDO_PIN=2

  -DRF24_CSN_PIN=6 -DRF24_CE_PIN=2 -DRF24_SCK_PIN=5 -DRF24_MISO_PIN=7 -DRF24_MOSI_PIN=4

  -DJTAG_SCAN_PINS="\"4, 5, 6, 7\""

; =========================================================
; Unexpected Maker ProS3 Board
;   To directly control the onboard LED from the LED menu
;   comment out the lines for the status LED definition
;   -DLED_PIN=18
;   -DLED_TYPE_RGB=true
;   Then change the DLED_DATA_PIN and set it to GPIO18
;   -DLED_DATA_PIN=18
; =========================================================
[env:um_pros3]
board = um_pros3
board_build.partitions = partitions/app4M_spiffs_12M_16MB.csv
lib_deps =
  crankyoldgit/IRremoteESP8266 @ ^2.9.0
  ${env.lib_deps}
build_flags =
  ${env.build_flags}

  -DDEVICE_UMPROS3

  ; Onboard resources: native USB 19/20, flash/PSRAM 26-32
  ; LDO2 enable 17, Vbat sense 10, USB sense 33
  -DPROTECTED_PINS="\"3, 10, 17, 18, 19, 20, 26, 27, 28, 29, 30, 31, 32, 33, 45, 46\""

  ; --- Board input used by menus before the terminal starts ---
  ; Default is the ESP32-S3 BOOT button: GPIO0, active LOW, INPUT_PULLUP.
  -DCUSTOM_INPUT_BUTTON_PIN=0
  -DCUSTOM_INPUT_BUTTON_ACTIVE_LOW=1
  -DCUSTOM_INPUT_BUTTON_PULLUP=1

  ; --- Builtin LED ---
  -DLED_PIN=18
  -DLED_TYPE_RGB=true

  ; --- OneWire ---
  -DONEWIRE_PIN=6

  ; --- UART ---
  -DUART_BAUD=9600
  -DUART_RX_PIN=44 -DUART_TX_PIN=43

  ; --- HDUART ---
  -DHDUART_BAUD=9600
  -DHDUART_PIN=44

  ; --- I2C Pins ---
  -DI2C_SCL_PIN=9 -DI2C_SDA_PIN=8
  -DI2C_FREQ=100000

  ; --- SPI ---
  ; Target/device SPI bus used by Bit Pirate modes. Keep separate from onboard display SPI if needed.
  -DSPI_CS_PIN=34 -DSPI_CLK_PIN=36 -DSPI_MISO_PIN=37 -DSPI_MOSI_PIN=35

  ; --- LoRa SX1262 ---
  -DLORA_SCK_PIN=36 -DLORA_MISO_PIN=37 -DLORA_MOSI_PIN=35 -DLORA_CS_PIN=34
  -DLORA_RST_PIN=3 -DLORA_BUSY_PIN=2 -DLORA_DIO1_PIN=1

  ; --- Infrared ---
  -DIR_TX_PIN=4 -DIR_RX_PIN=5

  ; --- LED strip / clocked LEDs ---
  -DLED_DATA_PIN=15 -DLED_CLOCK_PIN=16

  ; --- TwoWire / 3-wire ---
  -DTWOWIRE_CLK_PIN=36 -DTWOWIRE_IO_PIN=37 -DTWOWIRE_RST_PIN=34

  -DTHREEWIRE_CS_PIN=34 -DTHREEWIRE_SK_PIN=36 -DTHREEWIRE_DI_PIN=35 -DTHREEWIRE_DO_PIN=37

  ; --- I2S ---
  -DI2S_BCLK_PIN=42 -DI2S_LRCK_PIN=41 -DI2S_DATA_PIN=2
  -DI2S_SAMPLE_RATE=16000
  -DI2S_BITS=16

  ; --- CAN ---
  -DCAN_CS_PIN=4 -DCAN_SCK_PIN=5 -DCAN_SI_PIN=6 -DCAN_SO_PIN=7
  -DCAN_KBPS=125

  ; --- ETHERNET (W5500) ---
  -DETHERNET_CS_PIN=4 -DETHERNET_CLK_PIN=5 -DETHERNET_MISO_PIN=6 -DETHERNET_MOSI_PIN=7 -DETHERNET_IRQ_PIN=15

  ; --- SUBGHZ ---
  -DSUBGHZ_CS_PIN=4 -DSUBGHZ_SCK_PIN=5 -DSUBGHZ_SI_PIN=6 -DSUBGHZ_SO_PIN=7 -DSUBGHZ_GDO_PIN=15

  ; --- RF24 ---
  -DRF24_CSN_PIN=4 -DRF24_CE_PIN=15 -DRF24_SCK_PIN=5 -DRF24_MISO_PIN=7 -DRF24_MOSI_PIN=6

  ; --- JTAG ---
  -DJTAG_SCAN_PINS="\"4, 5, 6, 7, 15\""

