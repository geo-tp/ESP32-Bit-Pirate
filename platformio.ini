; =========================================================
; M5Stack Stick S3
; =========================================================
[env:m5stack-sticks3]
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
lib_deps =
  M5Unified=https://github.com/m5stack/M5Unified.git
  ${env.lib_deps}
build_flags =
  -DESP32S3
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -UINFRARED_IREMOTE_ESP8266 ; Use Arduino-IRremote as infrared lib
  ${env.build_flags}

  -DDEVICE_STICKS3

  ; --- Pin in use ---
  -DPROTECTED_PINS="\"21,22,23,24,25,38,39,40,41,45\""

  ; --- Builtin LED ---
  -DLED_PIN=1
  -DLED_TYPE_RGB=false

  ; --- OneWire ---
  -DONEWIRE_PIN=4

  ; --- UART ---
  -DUART_BAUD=9600
  -DUART_RX_PIN=4 -DUART_TX_PIN=5

  ; --- HDUART ---
  -DHDUART_BAUD=9600
  -DHDUART_PIN=4

  ; --- I2C ---
  -DI2C_SCL_PIN=4 -DI2C_SDA_PIN=5
  -DI2C_FREQ=100000

  ; --- SPI ---
  -DSPI_CS_PIN=5 -DSPI_CLK_PIN=6 -DSPI_MISO_PIN=4 -DSPI_MOSI_PIN=1

  ; --- LORA SX1262 ---
