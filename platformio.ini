  -DI2S_SAMPLE_RATE=16000
  -DI2S_BITS=16

  ; --- CAN ---
  -DCAN_CS_PIN=5 -DCAN_SCK_PIN=6 -DCAN_SI_PIN=1 -DCAN_SO_PIN=4
  -DCAN_KBPS=125

  ; --- ETHERNET (W5500) ---
