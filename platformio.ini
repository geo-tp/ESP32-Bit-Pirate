  ; --- I2S ---
  -DI2S_BCLK_PIN=41 -DI2S_LRCK_PIN=43 -DI2S_DATA_PIN=42
  -DI2S_SAMPLE_RATE=44100
  -DI2S_BITS=16

  ; --- CAN ---
  -DCAN_CS_PIN=12 -DCAN_SCK_PIN=40 -DCAN_SI_PIN=39 -DCAN_SO_PIN=14
  -DCAN_KBPS=125

  ; --- ETHERNET (W5500) ---
  -DETHERNET_CS_PIN=12 -DETHERNET_CLK_PIN=40 -DETHERNET_MISO_PIN=39 -DETHERNET_MOSI_PIN=14 -DETHERNET_IRQ_PIN=1

  ; --- SUBGHZ ---
  -DSUBGHZ_CS_PIN=12 -DSUBGHZ_SCK_PIN=40 -DSUBGHZ_SI_PIN=39 -DSUBGHZ_SO_PIN=14 -DSUBGHZ_GDO_PIN=1

  ; --- RF24 ---
