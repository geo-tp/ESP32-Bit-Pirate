  -DTWOWIRE_CLK_PIN=5 -DTWOWIRE_IO_PIN=4 -DTWOWIRE_RST_PIN=6

  -DTHREEWIRE_CS_PIN=6 -DTHREEWIRE_SK_PIN=5 -DTHREEWIRE_DI_PIN=4 -DTHREEWIRE_DO_PIN=7

