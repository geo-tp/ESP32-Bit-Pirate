  -DCAN_KBPS=125

  ; --- ETHERNET (W5500) ---
  -DETHERNET_CS_PIN=12 -DETHERNET_CLK_PIN=10 -DETHERNET_MOSI_PIN=9 -DETHERNET_MISO_PIN=11 -DETHERNET_IRQ_PIN=15

