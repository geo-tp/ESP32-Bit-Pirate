<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img" aria-labelledby="title desc">
  <title id="title">Firmware analysis companion tools</title>
  <desc id="desc">An illustrative binary analysis interface with a hex dump, detected file signatures and a map of firmware regions.</desc>
  <rect width="520" height="300" rx="8" fill="#0b0d0c"/>
  <rect x="16" y="16" width="488" height="268" rx="8" fill="#121615" stroke="#333"/>
  <rect x="16" y="16" width="488" height="42" rx="8" fill="#101412" stroke="#333"/>
  <rect x="30" y="27" width="22" height="22" rx="5" fill="#1a1a1a" stroke="#2f3a2f"/>
  <text x="37" y="43" fill="#00ff00" font-family="Menlo, Courier New, monospace" font-size="13" font-weight="900">B</text>
  <text x="64" y="41" fill="#e0e0e0" font-family="Menlo, Courier New, monospace" font-size="17" font-weight="700">Firmware analysis</text>
  <rect x="329" y="26" width="70" height="22" rx="5" fill="#0d0d0d" stroke="#2b2b2b"/>
  <text x="352" y="41" fill="#00ffcc" font-family="Menlo, Courier New, monospace" font-size="9">4 MB</text>
  <rect x="410" y="26" width="76" height="22" rx="5" fill="#26332a" stroke="#2b2b2b"/>
  <text x="424" y="41" fill="#b8ffb8" font-family="Menlo, Courier New, monospace" font-size="10" font-weight="700">Open BIN</text>

  <rect x="28" y="72" width="464" height="28" rx="6" fill="#0f0f0f" stroke="#333"/>
  <rect x="28" y="72" width="88" height="28" rx="6" fill="#17252b" stroke="#00ffcc" stroke-opacity=".55"/>
  <g font-family="Menlo, Courier New, monospace" font-size="10">
    <text x="47" y="90" fill="#00ffcc" font-weight="700">Hex view</text>
    <text x="131" y="90" fill="#d8ddd8">Signatures</text>
    <text x="220" y="90" fill="#d8ddd8">Strings</text>
    <text x="402" y="90" fill="#9aa0a6">firmware.bin</text>
  </g>

  <rect x="28" y="112" width="282" height="112" rx="7" fill="#080a09" stroke="#333"/>
  <path d="M28 140h282M82 140v84M256 140v84" stroke="#262d29"/>
  <g font-family="Menlo, Courier New, monospace" font-size="9">
    <text x="40" y="130" fill="#9aa0a6">OFFSET</text>
    <text x="94" y="130" fill="#00ff00" font-weight="700">HEX</text>
    <text x="267" y="130" fill="#9aa0a6">ASCII</text>
    <rect x="88" y="148" width="66" height="15" rx="3" fill="#153c32"/>
    <text x="40" y="159" fill="#9aa0a6">0000</text>
    <text x="94" y="159" fill="#d8fff2"><tspan fill="#00ffcc">7F 45 4C 46</tspan> 01 01 01 00</text>
    <text x="267" y="159" fill="#00ffcc">.ELF</text>
    <text x="40" y="177" fill="#9aa0a6">0008</text>
    <text x="94" y="177" fill="#d8ddd8">00 00 00 00 00 00 00 00</text>
    <text x="267" y="177" fill="#9aa0a6">....</text>
    <text x="40" y="195" fill="#9aa0a6">0010</text>
    <text x="94" y="195" fill="#d8ddd8">02 00 28 00 01 00 00 00</text>
    <text x="267" y="195" fill="#9aa0a6">..(.</text>
    <text x="40" y="213" fill="#9aa0a6">0018</text>
    <text x="94" y="213" fill="#d8ddd8">00 80 00 08 34 00 00 00</text>
    <text x="267" y="213" fill="#9aa0a6">....</text>
  </g>

  <rect x="322" y="112" width="170" height="112" rx="7" fill="#0f0f0f" stroke="#333"/>
  <text x="336" y="130" fill="#00ff00" font-family="Menlo, Courier New, monospace" font-size="10" font-weight="700">SIGNATURE SCAN</text>
  <path d="M322 140h170" stroke="#262d29"/>
  <g font-family="Menlo, Courier New, monospace" font-size="9">
    <circle cx="339" cy="155" r="3" fill="#00ffcc"/>
    <text x="351" y="159" fill="#d8fff2">ELF executable</text>
    <text x="351" y="173" fill="#9aa0a6">0x000000</text>
    <circle cx="339" cy="192" r="3" fill="#ffd166"/>
    <text x="351" y="196" fill="#d8fff2">LZMA data</text>
    <text x="351" y="210" fill="#9aa0a6">0x010000</text>
  </g>

  <rect x="28" y="238" width="464" height="30" rx="6" fill="#101412" stroke="#333"/>
  <g font-family="Menlo, Courier New, monospace" font-size="9">
    <text x="40" y="257" fill="#9aa0a6">REGIONS</text>
    <rect x="98" y="247" width="38" height="12" rx="3" fill="#0ea86b"/>
    <rect x="139" y="247" width="174" height="12" rx="3" fill="#b59d55"/>
    <rect x="316" y="247" width="64" height="12" rx="3" fill="#30473e"/>
    <circle cx="400" cy="253" r="3" fill="#00ff00"/>
    <text x="410" y="257" fill="#b8ffb8">2 matches</text>
  </g>
</svg>
