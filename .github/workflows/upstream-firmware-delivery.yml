name: Upstream Firmware Delivery

on:
  workflow_run:
    workflows:
      - Continuous Integration
    types:
      - completed
    branches:
      - pioarduino

permissions:
  contents: write

concurrency:
  group: upstream-firmware-delivery
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build and publish upstream firmware
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip setuptools
          python -m pip install --upgrade platformio

          # Standalone esptool used only to generate merged images.
          # Keep it independent from PlatformIO's internal tool-esptoolpy package.
          python -m pip install "esptool==5.3.1"

          pio --version
          esptool version

      - name: Build merged firmware images
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_DIR="${RUNNER_TEMP}/upstream-builds"
          DOWNLOAD_DIR="${OUTPUT_DIR}/downloads"

          SOURCE_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          rm -rf "${OUTPUT_DIR}"
          mkdir -p "${DOWNLOAD_DIR}"

          # Enable the full FastLED protocol set for upstream distributed builds.
          sed -i -E \
            's/^([[:space:]]*);[[:space:]]*(-D ENABLE_FASTLED_PROTOCOL_SWITCHES.*)$/\1\2/' \
            platformio.ini

          # Fail explicitly if the build flag could not be enabled.
          if ! grep -q '^[[:space:]]*-D ENABLE_FASTLED_PROTOCOL_SWITCHES' platformio.ini; then
            echo "Failed to enable ENABLE_FASTLED_PROTOCOL_SWITCHES."
            exit 1
          fi

          echo "FastLED protocol switches enabled for upstream builds."

          # Find every [env:...] section except native-tests.
          mapfile -t ENVIRONMENTS < <(
            awk -F'[][]' '
              /^\[env:[^]]+\]$/ {
                environment = $2
                sub(/^env:/, "", environment)

                if (environment != "native-tests") {
                  print environment
                }
              }
            ' platformio.ini
          )

          if [[ "${#ENVIRONMENTS[@]}" -eq 0 ]]; then
            echo "No firmware environments found in platformio.ini."
            exit 1
          fi

          echo "Environments to build:"
          printf ' - %s\n' "${ENVIRONMENTS[@]}"

          cat > "${OUTPUT_DIR}/README.md" <<EOF
          # ESP32 Bit Pirate — Upstream firmware

          Experimental firmware images generated automatically from the latest
          commit on the \`pioarduino\` branch that passed Continuous Integration.

          **These files are development builds, not stable releases.**

          - Branch: \`pioarduino\`
          - Commit: [\`${SOURCE_SHA}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${SOURCE_SHA})
          - Build date: \`${BUILD_DATE}\`
          - Channel: \`upstream\`

          ## Flash from your browser

          Each download is a complete merged firmware image containing the
          bootloader, partition table and application firmware.

          1. Download the firmware matching your board.
          2. Open the [ESP Tool](https://geo-tp.github.io/ESP32-Bit-Pirate/web-tools/esp-tool/).
          3. Connect the board through Web Serial.
          4. Drag and drop the downloaded \`.bin\` file into the tool.
          5. Start flashing.

          No separate bootloader, partition file or offset configuration is required.

          ## Downloads

          | Environment | Complete firmware |
          |---|---|
          EOF

          for ENVIRONMENT in "${ENVIRONMENTS[@]}"; do
            echo "::group::Build ${ENVIRONMENT}"

            pio run -e "${ENVIRONMENT}"

            BUILD_DIR=".pio/build/${ENVIRONMENT}"

            BOOTLOADER_IMAGE="${BUILD_DIR}/bootloader.bin"
            PARTITIONS_IMAGE="${BUILD_DIR}/partitions.bin"
            FIRMWARE_IMAGE="${BUILD_DIR}/firmware.bin"

            FIRMWARE_NAME="esp32-bit-pirate-${ENVIRONMENT}-upstream.bin"
            DESTINATION="${DOWNLOAD_DIR}/${FIRMWARE_NAME}"

            for FILE in \
              "${BOOTLOADER_IMAGE}" \
              "${PARTITIONS_IMAGE}" \
              "${FIRMWARE_IMAGE}"
            do
              if [[ ! -s "${FILE}" ]]; then
                echo "Required firmware component is missing or empty: ${FILE}"
                exit 1
              fi
            done

            echo "Merging firmware for ${ENVIRONMENT}..."

            esptool \
              --chip esp32s3 \
              merge-bin \
              -o "${DESTINATION}" \
              0x0 "${BOOTLOADER_IMAGE}" \
              0x8000 "${PARTITIONS_IMAGE}" \
              0x10000 "${FIRMWARE_IMAGE}"

            if [[ ! -s "${DESTINATION}" ]]; then
              echo "Merged firmware was not generated for ${ENVIRONMENT}."
              exit 1
            fi

            FIRMWARE_SIZE="$(stat --printf='%s' "${DESTINATION}")"

            echo "Created ${FIRMWARE_NAME} (${FIRMWARE_SIZE} bytes)"

            cat >> "${OUTPUT_DIR}/README.md" <<EOF
          | \`${ENVIRONMENT}\` | [Download BIN](downloads/${FIRMWARE_NAME}) |
          EOF

            echo "::endgroup::"
          done

          (
            cd "${DOWNLOAD_DIR}"
            sha256sum ./*.bin > "${OUTPUT_DIR}/SHA256SUMS.txt"
          )

          cat >> "${OUTPUT_DIR}/README.md" <<EOF

          ## Verification

          SHA-256 checksums are available in
          [SHA256SUMS.txt](SHA256SUMS.txt).

          Generated automatically from commit \`${SHORT_SHA}\`.
          EOF

      - name: Replace upstream-builds branch
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_DIR="${RUNNER_TEMP}/upstream-builds"
          SOURCE_SHA="$(git rev-parse --short=7 HEAD)"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Create a fresh history containing only the latest upstream builds.
          git checkout --orphan upstream-builds-publish
          git rm -rf .
          git clean -fdx

          cp -a "${OUTPUT_DIR}/." .

          git add --all
          git commit -m "upstream: build ${SOURCE_SHA}"

          git push \
            origin \
            HEAD:refs/heads/upstream-builds \
            --force
